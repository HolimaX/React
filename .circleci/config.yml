---
# Javascript Node CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.1/language-javascript/ for more details
#
version: 2.1
jobs:
  build:
    docker:
      # specify the version you desire here
      #- image: circleci/node:latest
      - image: cimg/python:3.10.14-node #jiripuc/circleci-python-node:python3.9-node12-gcloud-cypress
      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/mongo:3.4.4

    working_directory: ~/repo

    resource_class: xlarge

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "./package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      #- run: yarn install

      #- run: yarn upgrade

      - run: 'CI=false && npm cache clean -force && rm package-lock.json' 

      #- run: 'CI=false && npm i --save --legacy-peer-deps && npm install marked marked-man && npm audit fix && npm run build-nix'
      - run: npm i --save
      
      - run: npm audit fix
      
      - run: 'CI=false && npm run build-nix --verbose'

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "./package.json" }}

      # run tests!
      - run:
          shell: /bin/sh
          command: |
            echo Running test
            set -e
            EXIT_CODE=0
            npm test || EXIT_CODE=$?
            echo $EXIT_CODE

      - store_artifacts:
          path: ./build
