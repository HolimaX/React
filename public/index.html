    <style>
      /* Accessibility & WCAG 2.2 AA/AAA Enhancements */
      .skip-link {
        position: absolute;
        top: -60px;
        left: 10px;
        background: #000000;
        color: #ffffff;
        padding: 10px 18px;
        min-height: 44px;
        min-width: 44px;
        font-weight: 700;
        text-decoration: underline;
        z-index: 10000;
        border-radius: 0 0 6px 6px;
        transition: top 0.2s ease-in-out;
      }
      .skip-link:focus,
      .skip-link:focus-visible {
        top: 0;
        outline: 3px solid #ffc107;
        outline-offset: 2px;
      }
      :focus-visible {
        outline: 3px solid #0a58ca !important;
        outline-offset: 2px !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .skip-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>

    </noscript>
    <div id="root">

      <main id="main-content" role="main" aria-label="Cloud Dashboard Application Content" style="min-height: 60vh;">
        <div class="container text-center py-5">

        </div>
